services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: trium
      POSTGRES_USER: trium
      POSTGRES_PASSWORD: trium
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trium -d trium"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql

  server:
    build:
      context: ./server
    command: >
      sh -c "python scripts/migrate.py &&
      uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
      DATABASE_URL: postgresql+psycopg://trium:trium@db:5432/trium
      INSTANCE_CODE: ${INSTANCE_CODE:-}
      SECRET_KEY: ${SECRET_KEY:-local-development-only}
      TIMEZONE: ${TIMEZONE:-Europe/Warsaw}
      CLIENT_ORIGIN: http://localhost:5173
    ports:
      - "8000:8000"
    volumes:
      - ./server/app:/app/app
    depends_on:
      db:
        condition: service_healthy

  client:
    build:
      context: ./client
    environment:
      VITE_API_PROXY_TARGET: http://server:8000
    ports:
      - "5173:5173"
    volumes:
      - ./client:/app
      - client_node_modules:/app/node_modules
    depends_on:
      - server

volumes:
  client_node_modules:
  postgres_data:
